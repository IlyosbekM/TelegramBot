# QarzBot web admin — nginx (SPA + API proxy).
# /api/** so'rovlari Compose ichki tarmog'idagi app:8080 ga boradi —
# brauzer uchun hammasi bitta origin, shuning uchun CORS/cookie muammosi yo'q.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (session cookie'lar proxy orqali o'z-o'zidan o'tadi)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — react-router marshrutlari uchun har doim index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
