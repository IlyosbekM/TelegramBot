# ---- Yordam ----
help.client=ℹ️ *Помощь — Клиент*\n\nЧерез этого бота вы отслеживаете свои долги в магазинах в одном месте.\n\n💳 *Мои долги* — все ваши активные долги и общий остаток.\n📜 *История платежей* — список совершённых вами платежей.\n🏪 *Магазины* — все магазины; подключитесь к магазину кнопкой *🔗 Подключиться*.\n🔍 *Поиск магазина* — найти магазин по названию или ID.\n🏬 *Открыть магазин* — отправить администратору запрос на открытие своего магазина.\n⚙️ *Настройки* — включить/выключить автонапоминания.\n\n💵 *Оплата:* нажмите кнопку *💵 Оплатить* под долгом и введите сумму.\nЗапрос уйдёт продавцу — после подтверждения остаток обновится.\n\n❓ При вопросах обращайтесь к продавцу магазина.
help.seller=ℹ️ *Помощь — Продавец*\n\n➕ *Добавить долг* — выберите клиента из списка, введите сумму, описание и срок. Клиенту автоматически отправляется чек.\n📋 *Список долгов* — активные долги вашего магазина. В каждом: 💵 Оплата, ➕ Увеличить, ✏️ Редактировать, 🗑 Удалить, 📜 История, ⏰ Напоминание.\n👥 *Клиенты* — клиенты, подключённые к вашему магазину.\n🔍 *Поиск* — найти долг по имени или номеру телефона клиента.\n📥 *Запросы* — подтверждение запросов клиентов на подключение и оплату.\n📊 *Отчёт* — общее состояние по магазину.\n📈 *Статистика* — новые долги за месяц, собранные платежи и крупнейшие должники.\n🧾 *История* — история операций в магазине.\n⏰ *Отправить напоминание* — отправить напоминание должникам.\n📢 *Рассылка* — массовое сообщение всем вашим клиентам.\n\n💡 При приёме платежа клиенту автоматически отправляется чек.
help.admin=ℹ️ *Помощь — Администратор*\n\n➕ *Добавить магазин* — зарегистрировать новый магазин.\n🏪 *Магазины* — магазины и сумма их активных долгов.\n👥 *Пользователи* — все пользователи; изменение роли (продавец ⇄ клиент).\n📊 *Общий отчёт* — общая статистика по системе.\n⚙️ *Настройки* — статистика системы и данные администратора.\n📢 *Рассылка* — отправка сообщения всем / по магазину / выборочно.\n\n📥 Запросы на открытие магазина приходят сюда, с inline-кнопками.

# ---- /help qisqa yordam ----
help.cmd.admin=*Команды администратора:*\n➕ Добавить магазин — создать новый магазин\n🏪 Магазины — все магазины\n👥 Пользователи — управление пользователями\n📊 Общий отчёт — статистика по всем магазинам\n📢 Рассылка — массовое сообщение пользователям
help.cmd.seller=*Команды продавца:*\n➕ Добавить долг — записать долг подключённому клиенту\n📋 Список долгов — все активные долги\n👥 Клиенты — клиенты, подключённые к магазину\n🔍 Поиск — поиск клиента или долга\n📥 Запросы — запросы на подключение и оплату\n📊 Отчёт — статистика вашего магазина\n🧾 История — аудит операций\n⏰ Отправить напоминание — напоминание должникам\n📢 Рассылка — массовое сообщение клиентам
help.cmd.client=*Команды клиента:*\n💳 Мои долги — активные долги и оплата\n📜 История платежей — совершённые платежи\n🏪 Магазины — все магазины и подключение\n🔍 Поиск магазина — поиск по названию или ID

