# ---- Yordam (help) ----
help.client=ℹ️ *Yordam — Mijoz*\n\nBu bot orqali do'konlardagi qarzlaringizni bir joyda kuzatib borasiz.\n\n💳 *Mening qarzlarim* — barcha faol qarzlaringiz va umumiy qoldiq.\n📜 *To'lov tarixim* — siz qilgan to'lovlar ro'yxati.\n🏪 *Do'konlar* — barcha do'konlar; do'konga *🔗 Bog'lanish* tugmasi orqali ulanasiz.\n🔍 *Do'kon qidirish* — nomi yoki ID raqami bo'yicha do'kon topish.\n🏬 *Do'kon ochish* — o'z do'koningizni ochish so'rovini adminga yuborish.\n⚙️ *Sozlamalar* — avtomatik eslatmalarni yoqish/o'chirish.\n\n💵 *To'lov qilish:* qarz ostidagi *💵 To'lash* tugmasini bosing va summani kiriting.\nSo'rov sotuvchiga boradi — u tasdiqlagach, qoldiq yangilanadi.\n\n❓ Savol bo'lsa, do'kon sotuvchisiga murojaat qiling.
help.seller=ℹ️ *Yordam — Sotuvchi*\n\n➕ *Qarz qo'shish* — mijozni ro'yxatdan tanlab, summa, izoh va muddat kiritasiz. Mijozga avtomatik chek yuboriladi.\n📋 *Qarzlar ro'yxati* — do'koningizdagi faol qarzlar. Har birida: 💵 To'lov, ➕ Oshirish, ✏️ Tahrirlash, 🗑 O'chirish, 📜 Tarix, ⏰ Eslatma.\n👥 *Mijozlar* — do'koningizga bog'langan mijozlar.\n🔍 *Qidirish* — mijoz ismi yoki telefon raqami bo'yicha qarz topish.\n📥 *So'rovlar* — mijozlarning bog'lanish va to'lov so'rovlarini tasdiqlash.\n📊 *Hisobot* — do'kon bo'yicha umumiy holat.\n📈 *Statistika* — shu oygi yangi qarzlar, yig'ilgan to'lovlar va eng katta qarzdorlar.\n🧾 *Tarix* — do'kondagi amallar tarixi.\n⏰ *Eslatma yuborish* — qarzdorlarga eslatma yuborish.\n📢 *Xabar yuborish* — barcha mijozlaringizga ommaviy xabar.\n\n💡 To'lov qabul qilinganda mijozga avtomatik chek yuboriladi.
help.admin=ℹ️ *Yordam — Admin*\n\n➕ *Do'kon qo'shish* — yangi do'konni ro'yxatga olish.\n🏪 *Do'konlar* — do'konlar va ularning faol qarz miqdori.\n👥 *Foydalanuvchilar* — barcha foydalanuvchilar; rolni o'zgartirish (sotuvchi ⇄ klient).\n📊 *Umumiy hisobot* — tizim bo'yicha umumiy statistika.\n⚙️ *Sozlamalar* — tizim statistikasi va admin ma'lumotlari.\n📢 *Xabar yuborish* — hammaga / do'kon bo'yicha / tanlab xabar yuborish.\n\n📥 Do'kon ochish so'rovlari shu yerga, inline tugmalar bilan keladi.

# ---- /help slash buyrug'i uchun qisqa yordam (UpdateRouter.sendHelp) ----
help.cmd.admin=*Admin buyruqlari:*\n➕ Do'kon qo'shish — yangi do'kon yaratish\n🏪 Do'konlar — barcha do'konlar\n👥 Foydalanuvchilar — foydalanuvchilarni boshqarish\n📊 Umumiy hisobot — barcha do'konlar bo'yicha statistika\n📢 Xabar yuborish — foydalanuvchilarga ommaviy xabar
help.cmd.seller=*Sotuvchi buyruqlari:*\n➕ Qarz qo'shish — bog'langan mijozga qarz yozish\n📋 Qarzlar ro'yxati — barcha faol qarzlar\n👥 Mijozlar — do'konga bog'langan mijozlar\n🔍 Qidirish — mijoz yoki qarz qidirish\n📥 So'rovlar — bog'lanish va to'lov so'rovlari\n📊 Hisobot — do'koningiz statistikasi\n🧾 Tarix — amallar audit tarixi\n⏰ Eslatma yuborish — qarzdorlarga eslatma\n📢 Xabar yuborish — mijozlarga ommaviy xabar
help.cmd.client=*Mijoz buyruqlari:*\n💳 Mening qarzlarim — faol qarzlar va to'lash\n📜 To'lov tarixim — qilingan to'lovlar\n🏪 Do'konlar — barcha do'konlar va bog'lanish\n🔍 Do'kon qidirish — do'kon nomi yoki ID bo'yicha qidirish

