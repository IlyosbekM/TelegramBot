# ---- Help ----
help.client=ℹ️ *Help — Client*\n\nThrough this bot you track your debts across shops in one place.\n\n💳 *My debts* — all your active debts and total balance.\n📜 *Payment history* — list of payments you made.\n🏪 *Shops* — all shops; connect to a shop via the *🔗 Connect* button.\n🔍 *Search shop* — find a shop by name or ID.\n🏬 *Open shop* — send a request to the admin to open your own shop.\n⚙️ *Settings* — turn auto reminders on/off.\n\n💵 *Payment:* tap the *💵 Pay* button under a debt and enter the amount.\nThe request goes to the seller — once confirmed, the balance updates.\n\n❓ If you have questions, contact the shop seller.
help.seller=ℹ️ *Help — Seller*\n\n➕ *Add debt* — pick a client from the list, enter the amount, description and due date. A receipt is sent to the client automatically.\n📋 *Debt list* — active debts in your shop. Each has: 💵 Payment, ➕ Increase, ✏️ Edit, 🗑 Delete, 📜 History, ⏰ Reminder.\n👥 *Clients* — clients connected to your shop.\n🔍 *Search* — find a debt by client name or phone number.\n📥 *Requests* — confirm clients' connection and payment requests.\n📊 *Report* — overall status by shop.\n📈 *Statistics* — this month's new debts, collected payments and top debtors.\n🧾 *History* — operation history in the shop.\n⏰ *Send reminder* — send a reminder to debtors.\n📢 *Broadcast* — mass message to all your clients.\n\n💡 When a payment is accepted, a receipt is sent to the client automatically.
help.admin=ℹ️ *Help — Admin*\n\n➕ *Add shop* — register a new shop.\n🏪 *Shops* — shops and their active debt amount.\n👥 *Users* — all users; change role (seller ⇄ client).\n📊 *Overall report* — overall system statistics.\n⚙️ *Settings* — system statistics and admin info.\n📢 *Broadcast* — send a message to everyone / by shop / selectively.\n\n📥 Shop-opening requests arrive here, with inline buttons.

# ---- /help short help ----
help.cmd.admin=*Admin commands:*\n➕ Add shop — create a new shop\n🏪 Shops — all shops\n👥 Users — manage users\n📊 Overall report — statistics across all shops\n📢 Broadcast — mass message to users
help.cmd.seller=*Seller commands:*\n➕ Add debt — record a debt for a connected client\n📋 Debt list — all active debts\n👥 Clients — clients connected to the shop\n🔍 Search — search for a client or debt\n📥 Requests — connection and payment requests\n📊 Report — your shop's statistics\n🧾 History — operation audit history\n⏰ Send reminder — reminder to debtors\n📢 Broadcast — mass message to clients
help.cmd.client=*Client commands:*\n💳 My debts — active debts and payment\n📜 Payment history — payments made\n🏪 Shops — all shops and connection\n🔍 Search shop — search by shop name or ID

