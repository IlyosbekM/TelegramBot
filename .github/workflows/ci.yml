name: CI

# dev va prod ga har push / PR da build qiladi (testlar yo'q — faqat compile/package)
on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & verify
        run: mvn -B -ntp clean verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: qarz-bot-jar
          path: target/qarz-bot-*.jar
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend · Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
